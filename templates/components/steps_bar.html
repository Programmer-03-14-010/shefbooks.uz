<div class="steps-bar">
  <div class="sb-step {% if step > 1 %}done{% elif step == 1 %}current{% endif %}"><i>{% if step > 1 %}<span class="fa fa-check"></span>{% else %}1{% endif %}</i><span>Savat</span></div>
  <div class="sb-line {% if step > 1 %}done{% endif %}"></div>
  <div class="sb-step {% if step > 2 %}done{% elif step == 2 %}current{% endif %}"><i>{% if step > 2 %}<span class="fa fa-check"></span>{% else %}2{% endif %}</i><span>Ma'lumotlar</span></div>
  <div class="sb-line {% if step > 2 %}done{% endif %}"></div>
  <div class="sb-step {% if step > 3 %}done{% elif step == 3 %}current{% endif %}"><i>{% if step > 3 %}<span class="fa fa-check"></span>{% else %}3{% endif %}</i><span>To'lov</span></div>
  <div class="sb-line {% if step > 3 %}done{% endif %}"></div>
  <div class="sb-step {% if step == 4 %}current{% endif %}"><i>4</i><span>Tayyor</span></div>
</div>
