{% extends 'layouts/base.html' %}
{% block title %}Yangi parol{% endblock %}
{% block content %}
<section class="page-body" style="padding-top:70px"><div class="container">
  <div class="center-card">
    <div class="ico"><i class="fa fa-lock"></i></div>
    <h2>Yangi parol o'rnating</h2>
    <p>Yangi parolni kiriting va tasdiqlang.</p>
    {% if form.errors %}<div class="alert alert-error"><i class="fa fa-exclamation-circle"></i><span>Parollar mos kelmadi yoki noto'g'ri kiritildi.</span></div>{% endif %}
    <form method="post" action="{% url 'users:update-password' uid=uid token=token %}" novalidate>{% csrf_token %}
      <div class="field"><label class="label" for="n1">Yangi parol</label><div class="input-icon"><input class="input" style="padding-left:18px" id="n1" type="password" name="new_password1" required><button type="button" class="pw-toggle"><i class="fa fa-eye"></i></button></div></div>
      <div class="field"><label class="label" for="n2">Parolni takrorlang</label><input class="input" id="n2" type="password" name="new_password2" required></div>
      <button class="btn btn-yellow btn-lg btn-block" type="submit">Parolni yangilash</button>
    </form>
  </div>
</div></section>
{% endblock %}
